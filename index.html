<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Abasthan — Test Page</title>
  <style>
    :root {
      --bg: #0d1117;
      --fg: #c9d1d9;
      --accent: #58a6ff;
      --border: #30363d;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 640px;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      background: #161b22;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      color: var(--fg);
      margin-bottom: 0.5rem;
    }
    h1 span { color: var(--accent); }
    .subtitle {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      font-size: 0.8rem;
      background: #1f6f3a22;
      color: #3fb950;
      border: 1px solid #1f6f3a44;
      margin-bottom: 1.5rem;
    }
    .status::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #3fb950;
    }
    .info-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }
    .info-grid dt { color: #8b949e; }
    .info-grid dd { color: var(--fg); }
    .endpoint {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .endpoint code { color: var(--accent); }
    button {
      background: var(--accent);
      color: #0d1117;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.25rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    .output {
      margin-top: 1.25rem;
      padding: 1rem;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      color: #8b949e;
      min-height: 60px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Abasthan <span>Test</span></h1>
    <p class="subtitle">A minimal Node.js static test page</p>
    <div class="status">Operational</div>

    <dl class="info-grid">
      <dt>Runtime</dt><dd>Node.js</dd>
      <dt>Branch</dt><dd>main</dd>
      <dt>Repo</dt><dd>jasoncstar518/Abasthan</dd>
      <dt>Deployed</dt><dd id="deployed">—</dd>
    </dl>

    <div class="endpoint">
      <code>GET /api/health</code>
    </div>

    <button onclick="checkHealth()">Check Health</button>
    <div class="output" id="output">Ready.</div>
  </div>

  <script>
    async function checkHealth() {
      const out = document.getElementById("output");
      out.textContent = "Requesting...";
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        document.getElementById("deployed").textContent =
          new Date().toLocaleString();
      } catch (e) {
        out.textContent = "Error: " + e.message;
      }
    }
  </script>
</body>
</html>
